name: LEXORA APK Derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu çek
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter kur
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0' 
        channel: 'stable'
        cache: true

    # 1. Bağımlılıkları yükle
    - name: Bağımlılıkları yükle
      run: flutter pub get

    # 2. Android projesini sıfırdan oluştur (Eklentileri kendi kaydeder)
    - name: Android projesini oluştur
      run: flutter create --platforms=android --org com.lexora --project-name lexora_app .

    # 3. local.properties
    - name: local.properties oluştur
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

    # 4. APK derle (Hata gizleyici || true KALDIRILDI)
    - name: APK derle
      run: flutter build apk --release

    # 5. APK'yı yükle
    - name: APK'yı yükle
      uses: actions/upload-artifact@v4
      with:
        name: lexora-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

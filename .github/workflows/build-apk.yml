name: LEXORA APK Derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu çek
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter kur
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0' 
        channel: 'stable'
        cache: true

    # 1. Temizlik
    - name: Flutter Clean
      run: flutter clean

    # 2. Paketleri indir (sqflite'ın Android tarafına işlenmesini sağlar)
    - name: Bağımlılıkları yükle
      run: flutter pub get

    # 3. NDK Ayarı (Gerekli)
    - name: NDK sürümünü güncelle
      run: |
        # Android klasörü yoksa oluştur (build apk zaten oluşturacak ama biz önceden müdahale edelim)
        mkdir -p android/app
        # Not: flutter build apk komutu android klasörünü kendisi oluşturacak, bu yüzden burada bekleyeceğiz.

    # 4. APK Derle (Android klasörünü ve eklentileri kendisi oluşturur)
    - name: APK derle
      run: flutter build apk --release || true

    # 5. APK'yı Bul ve Yükle
    - name: APK Dosyalarını Bul
      run: find . -name "*.apk"

    - name: APK'yı yükle
      uses: actions/upload-artifact@v4
      with:
        name: lexora-apk
        path: "**/*.apk"
        retention-days: 30

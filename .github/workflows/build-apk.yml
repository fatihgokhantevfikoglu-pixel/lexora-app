name: LEXORA APK Derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu çek
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter kur
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Bağımlılıkları yükle
      run: flutter pub get

    - name: Android projesini oluştur
      run: flutter create --platforms=android --org com.lexora --project-name lexora_app .

    # KOTLİN SÜRÜMÜNÜ KESİN OLARAK 2.0.0 YAPAN GÜÇLÜ KOMUT
    - name: Kotlin sürümünü güncelle
      run: |
        # settings.gradle varsa güncelle
        if [ -f android/settings.gradle ]; then
          sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.0.0"/' android/settings.gradle
        fi
        # settings.gradle.kts varsa güncelle
        if [ -f android/settings.gradle.kts ]; then
          sed -i -E 's/id\("org.jetbrains.kotlin.android"\) version "[^"]+"/id("org.jetbrains.kotlin.android") version "2.0.0"/' android/settings.gradle.kts
        fi
        # build.gradle varsa güncelle (eski şablonlar için)
        if [ -f android/build.gradle ]; then
          sed -i -E "s/ext.kotlin_version = '[^']+'/ext.kotlin_version = '2.0.0'/" android/build.gradle
        fi

    - name: local.properties oluştur
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

    - name: İnternet iznini ekle
      run: |
        sed -i 's/<application/\<uses-permission android:name="android.permission.INTERNET"\/\>\n    <application/' android/app/src/main/AndroidManifest.xml

    - name: APK derle
      run: flutter build apk --release

    # APK'nın nereye kaydedildiğini kontrol et (garantiye alalım)
    - name: APK konumunu doğrula
      run: |
        echo "Derleme tamamlandı. Dosya aranıyor..."
        find build/app/outputs/flutter-apk/ -name "*.apk"

    - name: APK'yı yükle
      uses: actions/upload-artifact@v4
      with:
        name: lexora-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

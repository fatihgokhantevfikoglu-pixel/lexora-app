name: LEXORA APK Derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu çek
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter kur
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0' 
        channel: 'stable'
        cache: true

    - name: Bağımlılıkları yükle
      run: flutter pub get

    - name: Android projesini oluştur
      run: flutter create --platforms=android --org com.lexora --project-name lexora_app .

    # KRİTİK EKLEME: Eklentilerin Android'e kaydedilmesini zorla!
    - name: Eklentileri zorla kaydet
      run: |
        echo "Eklentileri Android tarafına kaydediyorum..."
        # Flutter'ın eklentileri kendi oluşturduğu dosyaya yazmasını sağla
        flutter pub get
        flutter build apk --debug || true
        # Ana derleme öncesi eklenti kayıt dosyasını kontrol et
        if [ -f "android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java" ]; then
          echo "Eklenti kaydı bulundu!"
        else
          echo "Eklenti kaydı BULUNAMADI! (Bu dosya Flutter tarafından derleme anında oluşturulur)"
        fi

    - name: NDK sürümünü güncelle
      run: |
        if [ -f android/app/build.gradle.kts ]; then
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
        fi
        if [ -f android/app/build.gradle ]; then
          sed -i 's/ndkVersion flutter.ndkVersion/ndkVersion "27.0.12077973"/' android/app/build.gradle
        fi

    - name: local.properties oluştur
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

    - name: İnternet iznini ekle
      run: |
        sed -i 's/<application/\<uses-permission android:name="android.permission.INTERNET"\/\>\n    <application/' android/app/src/main/AndroidManifest.xml

    - name: APK derle
      run: flutter build apk --release

    - name: APK'yı yükle
      uses: actions/upload-artifact@v4
      with:
        name: lexora-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

name: LEXORA APK Derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu çek
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter kur
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Bağımlılıkları yükle
      run: flutter pub get

    - name: Android projesini oluştur
      run: flutter create --platforms=android --org com.lexora --project-name lexora_app .

    # KRİTİK EKLEME: local.properties dosyasını elle oluştur
    - name: local.properties oluştur
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

    - name: İnternet iznini ekle
      run: |
        sed -i 's/<application/\<uses-permission android:name="android.permission.INTERNET"\/\>\n    <application/' android/app/src/main/AndroidManifest.xml

    - name: APK derle
      run: flutter build apk --release

    - name: APK'yı yükle
      uses: actions/upload-artifact@v4
      with:
        name: lexora-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

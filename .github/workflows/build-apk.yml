name: LEXORA APK Derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu çek
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter kur
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0' 
        channel: 'stable'
        cache: true

    # 1. ADIM: Android klasörünü Flutter'ın kendisine oluşturt
    - name: Android projesini oluştur
      run: flutter create --platforms=android --org com.lexora --project-name lexora_app .

    # 2. ADIM: Temizlik ve Paketleri Yükleme (Eklentilerin Android'e gömülmesi için)
    - name: Flutter Clean
      run: flutter clean

    - name: Bağımlılıkları yükle
      run: flutter pub get

    # 3. ADIM: Ayarlar (NDK, minSdk ve local.properties)
    - name: Ayarları yap
      run: |
        # NDK sürümü
        if [ -f android/app/build.gradle.kts ]; then
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle.kts
        fi
        if [ -f android/app/build.gradle ]; then
          sed -i 's/ndkVersion flutter.ndkVersion/ndkVersion "27.0.12077973"/' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
        fi

    - name: local.properties oluştur
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

    # 4. ADIM: İnternet İzni
    - name: İnternet iznini ekle
      run: |
        sed -i 's/<application/\<uses-permission android:name="android.permission.INTERNET"\/\>\n    <application/' android/app/src/main/AndroidManifest.xml

    # 5. ADIM: Derleme (Eğer hata verirse burada duracak, hatayı görebileceğiz)
    - name: APK derle
      run: flutter build apk --release

    # 6. ADIM: APK'yı yükle
    - name: APK'yı yükle
      uses: actions/upload-artifact@v4
      with:
        name: lexora-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

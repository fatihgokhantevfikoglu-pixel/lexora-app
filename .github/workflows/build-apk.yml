name: LEXORA APK Derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu çek
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter kur
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0' 
        channel: 'stable'
        cache: true

    - name: Bağımlılıkları yükle
      run: flutter pub get

    - name: Android projesini oluştur
      run: flutter create --platforms=android --org com.lexora --project-name lexora_app .

    - name: NDK sürümünü güncelle
      run: |
        if [ -f android/app/build.gradle.kts ]; then
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
        fi
        if [ -f android/app/build.gradle ]; then
          sed -i 's/ndkVersion flutter.ndkVersion/ndkVersion "27.0.12077973"/' android/app/build.gradle
        fi

    - name: local.properties oluştur
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

    - name: İnternet iznini ekle
      run: |
        sed -i 's/<application/\<uses-permission android:name="android.permission.INTERNET"\/\>\n    <application/' android/app/src/main/AndroidManifest.xml

    # HATA VERSE BİLE DEVAM ET (Çünkü Gradle arka planda başarıyla derledi)
    - name: APK derle
      run: flutter build apk --release || true

    # SİSTEMDEKİ TÜM APK DOSYALARINI BUL
    - name: APK Dosyalarını Bul
      run: find . -name "*.apk"

    # BULUNAN TÜM APK'LARI YÜKLE
    - name: APK'yı yükle
      uses: actions/upload-artifact@v4
      with:
        name: lexora-apk
        path: "**/*.apk"
        retention-days: 30
